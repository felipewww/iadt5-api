services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fiap-analyzer
    restart: unless-stopped
    ports:
      - "3300:3300"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - platform

networks:
  platform:
    name: platform_default
    external: true

volumes:
  node_modules:
